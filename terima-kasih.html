<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Terima Kasih - BETA.AUS</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" crossorigin href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','sans-serif'] }, colors: { brandOrange: '#F28C28', cardBg: '#211710', cardBorder: '#3F2C1F', offWhite: '#F3EBE1', mutedBeige: '#D5C7B8' } } } }
</script>
<style>
html,body{height:100%;margin:0;padding:0;background-color:#0e0906;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;background-image:linear-gradient(rgba(8,6,5,.86),rgba(8,6,5,.95)),url('./background.jpg');background-size:cover;background-position:center top;background-attachment:fixed;}
.bg-custom-hero{background-image:linear-gradient(180deg,rgba(10,8,7,.45) 0%,rgba(15,11,8,.55) 30%,rgba(14,9,6,.70) 70%,rgba(12,8,5,.88) 100%);background-size:cover;background-position:center;background-repeat:no-repeat;}
</style>
</head>
<body class="flex items-center justify-center min-h-screen bg-neutral-950 p-0 sm:p-4" style="background-color:rgb(10,10,10);">
<main class="relative w-full max-w-[390px] h-[844px] overflow-hidden flex flex-col justify-between px-6 pt-12 pb-8 text-offWhite select-none shadow-2xl" style="background-color:transparent;">
<div class="flex flex-col w-full">
<header class="mb-24 pt-2">
<h1 class="text-[13px] tracking-[0.22em] font-semibold text-offWhite uppercase">BETA.AUS</h1>
<div class="w-10 h-[2.5px] bg-brandOrange mt-1.5 rounded-full"></div>
</header>
<section class="flex flex-col items-start mb-6">
<div class="w-16 h-16 rounded-full border-[2.5px] border-brandOrange flex items-center justify-center mb-6">
<svg class="w-7 h-7 text-brandOrange" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
</div>
<h2 class="text-[34px] sm:text-4xl font-extrabold tracking-tight text-white mb-3 leading-tight">Terima kasih!</h2>
<p id="thanks-sub" class="text-[15px] leading-relaxed text-mutedBeige font-normal max-w-[320px]">Masukan Anda sudah kami terima dan akan kami baca langsung oleh tim.</p>
</section>
<section class="w-full bg-cardBg/90 backdrop-blur-md rounded-2xl p-5 border border-cardBorder shadow-lg mt-2">
<h3 class="text-white text-[17px] font-bold tracking-tight mb-2">Menikmati kopinya?</h3>
<p class="text-mutedBeige text-[13.5px] leading-snug mb-5 font-normal">Bantu kami dengan ulasan singkat di Google Maps. Hanya butuh beberapa detik.</p>
<a class="w-full py-3 px-4 rounded-xl border border-brandOrange bg-neutral-900/60 active:bg-neutral-900 text-brandOrange font-semibold text-[14px] flex items-center justify-center transition-colors text-center" href="https://www.google.com/maps/place/Beta+Aus/@-10.1686686,123.6055648,17z/data=!4m8!3m7!1s0x2c5683d5836a5007:0xdfb520f54cdfa977!8m2!3d-10.1686739!4d123.6081397!9m1!1b1!16s%2Fg%2F11y1vbgwvr?entry=ttu&g_ep=EgoyMDI2MTAwNy4wIKXMDSoASAFQAw%3D%3D" target="_blank" rel="noopener">Tulis ulasan di Google Maps</a>
</section>
</div>
<footer class="w-full flex justify-center pb-2">
<a href="./index.html" class="w-full py-3 px-4 rounded-xl bg-[#F28C28] active:bg-[#e07f20] text-[#120D0A] font-bold text-[14px] flex items-center justify-center transition-colors text-center">Kembali ke halaman awal</a>
</footer>
</main>
<script>
const p = new URLSearchParams(location.search);
const r = parseInt(p.get('rating') || '0', 10);
if (r >= 1 && r <= 5) {
  document.getElementById('thanks-sub').textContent = `Terima kasih atas rating ${r} bintang! Masukan Anda sudah kami terima dan akan dibaca langsung oleh tim BETA.AUS.`;
}
</script>
</body>
</html>
